# ~/.tmux.conf

# Ensure log directory exists
run "mkdir -p ~/log"

# Основные настройки
# tmux-256color корректно описывает возможности tmux, а terminal-features
# включает true color в современных терминалах, включая Kitty.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB,alacritty:RGB"
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000

# Убираем задержку после Escape и передаём события фокуса приложениям внутри
# tmux (полезно для Vim/Neovim и терминальных интерфейсов).
set -sg escape-time 10
set -g focus-events on
set -g set-clipboard on

# Мышь
set -g mouse on

# Режим копирования с привычными vi-клавишами. Выделенный текст копируется в
# буфер tmux; set-clipboard выше также передаёт его терминалу через OSC 52.
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Клавиши-префикс
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Перезагрузка конфига
# ИСПРАВЛЕНО: Путь теперь указывает на этот файл, а не на файл в домашней директории
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Разделение окон; логирование подключается глобальными hooks ниже.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Навигация между панелями
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Ресайз панелей
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Статус бар
set -g status on
set -g status-interval 1
set -g status-justify centre
set -g status-left-length 100
set -g status-right-length 100

# Цвета статус бара
set -g status-style fg=white,bg=black
set -g status-left "#[fg=green]#S #[fg=white]|"
set -g status-right "#[fg=cyan]%H:%M | %d-%b-%y"

# Окна в статус баре
set -g window-status-format "#I:#W"
set -g window-status-current-format "#[fg=yellow]#I:#W"

# Уведомления
set -g visual-activity on
set -g visual-bell on
set -g visual-silence on
setw -g monitor-activity on
set -g bell-action any

# Быстрое создание окон
bind c new-window -c "#{pane_current_path}"

# Логирование каждой панели в отдельный файл. Hooks охватывают начальную панель
# новой сессии, новые окна и split-панели независимо от способа их создания.
# -o не открывает второй pipe, если два события относятся к одной новой панели.
set-hook -g after-new-session 'pipe-pane -o -t "#{hook_pane}" "cat >> ~/log/tmux-#{session_name}-#{session_created}-w#{window_index}-p#{pane_index}-#{pane_id}.log"'
set-hook -g after-new-window 'pipe-pane -o -t "#{hook_pane}" "cat >> ~/log/tmux-#{session_name}-#{session_created}-w#{window_index}-p#{pane_index}-#{pane_id}.log"'
set-hook -g after-split-window 'pipe-pane -o -t "#{hook_pane}" "cat >> ~/log/tmux-#{session_name}-#{session_created}-w#{window_index}-p#{pane_index}-#{pane_id}.log"'
