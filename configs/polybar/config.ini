; Catppuccin Mocha
[colors]
bg       = #1e1e2e
bg-alt   = #313244
surface  = #45475a
overlay  = #6c7086
text     = #cdd6f4
subtext  = #a6adc8
lavender = #b4befe
blue     = #89b4fa
sky      = #89dceb
teal     = #94e2d5
green    = #a6e3a1
yellow   = #f9e2af
peach    = #fab387
red      = #f38ba8
mauve    = #cba6f7
pink     = #f5c2e7

[bar/main]
monitor = ${env:MONITOR}
width = 100%
height = 30pt
offset-x = 0
offset-y = 0
radius = 0
fixed-center = true

background = ${colors.bg}
foreground = ${colors.text}

line-size = 2pt
border-size = 0

padding-left = 2
padding-right = 2

module-margin-left = 0
module-margin-right = 0

font-0 = "CaskaydiaCove Nerd Font:size=10;3"
font-1 = "Font Awesome 7 Free:style=Solid:size=10;3"
font-2 = "Font Awesome 7 Brands:size=10;3"

modules-left = i3
modules-center = date
modules-right = xkeyboard sep wired wireless sep cpu sep memory sep temperature sep pulseaudio sep battery sep powermenu tray

wm-restack = i3

[bar/main_scaled]
inherit = bar/main
height = 56pt
font-0 = "CaskaydiaCove Nerd Font:size=20;3"
font-1 = "Font Awesome 7 Free:style=Solid:size=20;3"
font-2 = "Font Awesome 7 Brands:size=20;3"

; ─── Separator ───────────────────────────────────────────────────────────────

[module/sep]
type = custom/text
format = " │ "
format-foreground = ${colors.overlay}

; ─── Workspaces ──────────────────────────────────────────────────────────────

[module/i3]
type = internal/i3
format = <label-state> <label-mode>
index-sort = true
wrapping-scroll = false

label-mode-padding = 2
label-mode-foreground = ${colors.bg}
label-mode-background = ${colors.mauve}

label-focused = %index%
label-focused-foreground = ${colors.lavender}
label-focused-underline = ${colors.lavender}
label-focused-padding = 2

label-unfocused = %index%
label-unfocused-foreground = ${colors.subtext}
label-unfocused-padding = 2

label-visible = %index%
label-visible-foreground = ${colors.sky}
label-visible-underline = ${colors.sky}
label-visible-padding = 2

label-urgent = %index%
label-urgent-foreground = ${colors.red}
label-urgent-underline = ${colors.red}
label-urgent-padding = 2

; ─── Date / Time ─────────────────────────────────────────────────────────────

[module/date]
type = internal/date
interval = 1

date = "%d.%m.%Y"
time = "%H:%M:%S"

label = %date%  %time%
label-foreground = ${colors.text}

click-left = gsimplecal

; ─── Keyboard layout ─────────────────────────────────────────────────────────

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock
blacklist-1 = scroll lock
blacklist-2 = caps lock

format = <label-layout>
label-layout = %layout%
label-layout-foreground = ${colors.pink}

; ─── Network ─────────────────────────────────────────────────────────────────

[module/wired]
type = internal/network
interface-type = wired

format-connected = <label-connected>
format-disconnected = ""

label-connected = "%{F#a6e3a1}↑%{F-}%upspeed:6% %{F#89b4fa}↓%{F-}%downspeed:6%"

[module/wireless]
type = internal/network
interface-type = wireless

format-connected = <label-connected>
format-disconnected = ""

label-connected = "%{F#89dceb}%essid%%{F-} %{F#a6e3a1}↑%{F-}%upspeed:6% %{F#89b4fa}↓%{F-}%downspeed:6%"

; ─── CPU ─────────────────────────────────────────────────────────────────────

[module/cpu]
type = internal/cpu
interval = 2
format = <label>
label = %percentage%%
label-foreground = ${colors.blue}

; ─── Memory ──────────────────────────────────────────────────────────────────

[module/memory]
type = internal/memory
interval = 2
format = <label>
label = %percentage_used%%
label-foreground = ${colors.mauve}

; ─── Temperature ─────────────────────────────────────────────────────────────

[module/temperature]
type = internal/temperature
thermal-zone = 0
warn-temperature = 70
crit-temperature = 80
interval = 2

format = <label>
label = %temperature-c%
label-foreground = ${colors.peach}

format-warn = <label-warn>
label-warn = %temperature-c%
label-warn-foreground = ${colors.red}

; ─── Audio ───────────────────────────────────────────────────────────────────

[module/pulseaudio]
type = internal/pulseaudio

format-volume = <label-volume>
label-volume = %percentage%%
label-volume-foreground = ${colors.teal}

format-muted = <label-muted>
label-muted = muted
label-muted-foreground = ${colors.overlay}

click-left = pactl set-sink-mute @DEFAULT_SINK@ toggle
scroll-up = pactl set-sink-volume @DEFAULT_SINK@ +5%
scroll-down = pactl set-sink-volume @DEFAULT_SINK@ -5%

; ─── Battery ─────────────────────────────────────────────────────────────────

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 98

format-charging = <label-charging>
label-charging = %percentage%%↑
label-charging-foreground = ${colors.yellow}

format-discharging = <label-discharging>
label-discharging = %percentage%%
label-discharging-foreground = ${colors.green}

format-full = <label-full>
label-full = ••
label-full-foreground = ${colors.green}

; ─── Power menu ──────────────────────────────────────────────────────────────

[module/powermenu]
type = custom/text
format = "  ⏻  "
format-foreground = ${colors.red}
format-background = ${colors.bg-alt}
click-left = ~/.config/polybar/powermenu.sh &

; ─── Tray ────────────────────────────────────────────────────────────────────

[module/tray]
type = internal/tray
tray-padding = 4
tray-maxsize = 16

; ─────────────────────────────────────────────────────────────────────────────

[settings]
screenchange-reload = true
